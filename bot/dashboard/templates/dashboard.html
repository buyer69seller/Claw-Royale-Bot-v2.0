<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦞 Claw Royale Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1f2e, #0d1520);
            padding: 20px 30px;
            border-bottom: 2px solid #2a3a5a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #00d4ff; font-size: 24px; }
        .status {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            background: #00ff8844;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: #131b2b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #1f2a3f;
        }
        .card h3 { color: #8899bb; font-size: 14px; text-transform: uppercase; margin-bottom: 10px; }
        .card .value { font-size: 32px; font-weight: bold; color: #00d4ff; }
        .card .label { color: #667799; font-size: 12px; margin-top: 5px; }
        .logs-container {
            background: #0a0e17;
            border-radius: 12px;
            border: 1px solid #1f2a3f;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry { padding: 4px 0; border-bottom: 1px solid #0d1520; color: #8899bb; }
        .log-entry .time { color: #445566; }
        .log-entry .level-INFO { color: #00d4ff; }
        .log-entry .level-WARNING { color: #ffaa44; }
        .log-entry .level-ERROR { color: #ff4444; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0e17; }
        ::-webkit-scrollbar-thumb { background: #1f2a3f; border-radius: 4px; }
        .live-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin-right: 8px;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>🦞 Claw Royale Bot</h1>
        <span class="status"><span class="live-dot"></span>Online</span>
    </div>
    <div class="container">
        <div class="grid" id="stats">
            <div class="card"><h3>📊 Status</h3><div class="value" id="status">Running</div></div>
            <div class="card"><h3>🎮 Games</h3><div class="value" id="games">0</div></div>
            <div class="card"><h3>🎯 Current</h3><div class="value" id="current">None</div></div>
            <div class="card"><h3>⏱️ Uptime</h3><div class="value" id="uptime">0s</div></div>
        </div>
        <div class="card" style="margin-bottom:20px;">
            <h3>⚙️ Configuration</h3>
            <div id="config" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;"></div>
        </div>
        <div class="card">
            <h3>📜 Live Logs</h3>
            <div class="logs-container" id="logs"></div>
        </div>
    </div>
    <script>
        let start = Date.now();
        function update() {
            fetch('/api/status').then(r=>r.json()).then(d=>{
                document.getElementById('status').textContent = d.status || 'Unknown';
                document.getElementById('games').textContent = d.games_played || 0;
                document.getElementById('current').textContent = d.current_game || 'None';
                let s = Math.floor((Date.now() - start) / 1000);
                document.getElementById('uptime').textContent = `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m ${s%60}s`;
            });
            fetch('/api/config').then(r=>r.json()).then(d=>{
                const c = document.getElementById('config');
                c.innerHTML = '';
                for (const [k,v] of Object.entries(d)) {
                    const div = document.createElement('div');
                    div.style.cssText = 'display:flex;justify-content:space-between;padding:8px 12px;background:#0d1520;border-radius:6px;font-size:13px;';
                    div.innerHTML = `<span style="color:#667799;">${k}</span><span style="color:#00d4ff;">${v||'-'}</span>`;
                    c.appendChild(div);
                }
            });
            fetch('/api/logs').then(r=>r.json()).then(d=>{
                const container = document.getElementById('logs');
                container.innerHTML = '';
                if (d.logs) {
                    d.logs.forEach(line => {
                        const div = document.createElement('div');
                        div.className = 'log-entry';
                        const match = line.match(/(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) - (\w+) - (\w+) - (.+)/);
                        if (match) {
                            div.innerHTML = `<span class="time">${match[1]}</span> <span class="level-${match[3]}">[${match[3]}]</span> ${match[4]}`;
                        } else {
                            div.textContent = line;
                        }
                        container.appendChild(div);
                    });
                    container.scrollTop = container.scrollHeight;
                }
            });
        }
        setInterval(update, 2000);
        update();
    </script>
</body>
</html>
